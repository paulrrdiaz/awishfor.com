<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Surprised rainbow baby unicorn</title>
  <desc id="desc">A kawaii seated baby unicorn with raised hooves, a delighted smile, and a flowing rainbow mane and tail.</desc>
  <defs>
    <linearGradient id="pearl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8F7FF"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFF59A"/><stop offset="1" stop-color="#F4D33F"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F7D8E6"/><stop offset=".5" stop-color="#D5F2EC"/><stop offset="1" stop-color="#DCECF8"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- sparkle accents -->
  <g stroke="#3E397B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="m132 157 9 20 21 9-21 10-9 21-10-21-20-10 20-9z" fill="#FFF16F"/>
    <path d="m95 108 6 13 14 6-14 7-6 14-7-14-13-7 13-6z" fill="#67DDE3"/>
    <path d="m112 249 7 15 16 7-16 8-7 16-8-16-15-8 15-7z" fill="#F68AB8"/>
    <circle cx="164" cy="111" r="5" fill="#F6A6C7" stroke="none"/>
  </g>

  <!-- floor glow -->
  <ellipse cx="373" cy="634" rx="238" ry="28" fill="#9EBEC8" opacity=".22" filter="url(#blur)"/>
  <ellipse cx="373" cy="624" rx="228" ry="22" fill="url(#ground)" opacity=".82"/>

  <!-- rainbow tail behind body -->
  <g stroke="#3E397B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M480 489c68-39 151-12 185 51 12 22 15 45 12 65-42-28-79-17-114 8-37 27-84 25-114-1 46-29 62-73 31-123z" fill="#F27DB3"/>
    <path d="M493 515c56-28 116-10 147 32 9 13 15 27 16 40-35-17-65-6-94 14-30 21-65 20-89 5 38-25 47-57 20-91z" fill="#FFF071" stroke="none"/>
    <path d="M507 539c40-18 84-7 109 23 6 7 11 16 14 24-27-7-49 3-71 17-24 15-50 13-67 2 29-20 36-42 15-66z" fill="#59D7E6" stroke="none"/>
    <path d="M520 561c28-10 56-3 75 15-17 1-34 10-49 19-14 8-28 7-40 3 19-13 23-25 14-37z" fill="#7D6AE6" stroke="none"/>
  </g>

  <!-- seated body -->
  <g stroke="#3E397B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M271 417c-46 47-66 119-39 169 19 36 57 50 103 34 43 21 97 18 133-8 49 18 91-4 101-44 13-54-18-122-66-158-57-42-174-37-232 7z" fill="url(#pearl)"/>
    <!-- soft belly -->
    <ellipse cx="385" cy="526" rx="80" ry="95" fill="#FFFFFF" stroke="none" opacity=".78"/>
    <!-- left hind leg -->
    <path d="M271 540c-31-10-68 12-77 44-8 31 13 56 48 58 38 2 69-23 74-61-9-20-23-34-45-41z" fill="#FDFBFF"/>
    <path d="M202 587c26-12 58-3 75 20-9 21-31 34-55 31-22-3-32-22-20-51z" fill="#F6BDD3" stroke="none"/>
    <path d="M215 626q29 13 57-5" fill="none" stroke="#E89AB9" stroke-width="7"/>
    <!-- right hind leg -->
    <path d="M478 544c30-13 69 5 82 36 12 30-6 58-40 64-38 7-72-14-82-51 7-21 19-38 40-49z" fill="#FDFBFF"/>
    <path d="M454 594c23-17 57-13 77 7-6 23-26 38-51 38-22 0-36-18-26-45z" fill="#F6BDD3" stroke="none"/>
    <path d="M464 629q30 10 56-10" fill="none" stroke="#E89AB9" stroke-width="7"/>
  </g>

  <!-- side mane behind the head -->
  <g stroke="#3E397B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M463 239c48 26 67 78 56 126-5 21 0 42 20 57-6 25-30 37-51 25 3 25-24 42-47 27 10-35 10-77-10-111z" fill="#F27DB3"/>
    <path d="M472 274c28 25 38 60 30 92-5 20 2 37 18 47" fill="none" stroke="#FFF071" stroke-width="22"/>
    <path d="M480 299c13 21 17 45 11 66-4 14 0 28 9 38" fill="none" stroke="#59D7E6" stroke-width="12"/>
  </g>

  <!-- ears -->
  <g stroke="#3E397B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M261 211c-31-43-3-83 37-53 20 15 19 48 12 72z" fill="url(#pearl)"/>
    <path d="M459 224c24-48 67-33 61 17-3 28-28 43-51 48z" fill="url(#pearl)"/>
    <path d="M278 181c13 11 18 28 16 45" fill="none" stroke="#F3A5C2" stroke-width="10"/>
    <path d="M486 239c-8 12-17 21-30 27" fill="none" stroke="#F3A5C2" stroke-width="10"/>
  </g>

  <!-- head -->
  <g stroke="#3E397B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M222 271c24-75 97-117 175-101 79 16 132 83 124 164-8 82-67 139-154 139-86 0-153-54-159-135-2-23 3-46 14-67z" fill="url(#pearl)"/>
    <!-- soft muzzle patch -->
    <path d="M219 359c41-33 94-43 148-35 54 7 101 29 133 65-24 55-70 84-133 84-75 0-129-40-148-114z" fill="#F9D2E0" stroke="none"/>
    <!-- eyes -->
    <ellipse cx="303" cy="310" rx="30" ry="38" fill="#3E397B"/>
    <ellipse cx="429" cy="326" rx="30" ry="38" fill="#3E397B"/>
    <circle cx="294" cy="298" r="10" fill="#FFFFFF" stroke="none"/>
    <circle cx="420" cy="314" r="10" fill="#FFFFFF" stroke="none"/>
    <circle cx="311" cy="324" r="5" fill="#FFFFFF" stroke="none"/>
    <circle cx="437" cy="340" r="5" fill="#FFFFFF" stroke="none"/>
    <!-- eyelashes -->
    <path d="M282 278l-11-12m27 6-3-15m111 30 5-15m11 19 12-10" fill="none" stroke-width="7"/>
    <!-- blush -->
    <ellipse cx="247" cy="369" rx="25" ry="11" fill="#F45F9B" stroke="none" opacity=".85"/>
    <ellipse cx="481" cy="397" rx="25" ry="11" fill="#F45F9B" stroke="none" opacity=".85"/>
    <!-- nostrils -->
    <ellipse cx="340" cy="373" rx="4" ry="7" fill="#3E397B" stroke="none"/>
    <ellipse cx="365" cy="376" rx="4" ry="7" fill="#3E397B" stroke="none"/>
    <!-- delighted open mouth -->
    <path d="M330 398q34 17 65 4c1 38-17 55-38 51-22-4-32-23-27-55z" fill="#3E397B"/>
    <path d="M342 439q16-11 33 1" fill="none" stroke="#F36FA7" stroke-width="9"/>
  </g>

  <!-- rainbow forelock over the forehead -->
  <g stroke="#3E397B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M247 236c36-70 135-100 219-50 7 43-16 74-49 91-40 20-89 14-120-15-19 10-37 1-50-26z" fill="#F27DB3"/>
    <path d="M279 216c43-45 107-50 158-20-8 31-31 48-60 54-36 7-70-3-98-34z" fill="#9B76E8" stroke="none"/>
    <path d="M313 198c39-23 83-17 115 3-13 23-35 35-60 37-23 2-42-10-55-40z" fill="#59D7E6" stroke="none"/>
    <path d="M354 188c27-7 53 0 72 13-13 15-31 23-49 22-12-4-19-16-23-35z" fill="#FFF071" stroke="none"/>
  </g>

  <!-- horn in front of forelock -->
  <g stroke="#3E397B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="m330 207 28-127 39 132z" fill="url(#horn)"/>
    <path d="m344 142 35 16m-42 22 52 19" fill="none" stroke="#D6AD31" stroke-width="7"/>
  </g>

  <!-- raised forehooves -->
  <g stroke="#3E397B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M243 428c-21-36-59-38-75-5-17 34 5 85 43 93 26 5 49-15 47-43-1-17-6-32-15-45z" fill="url(#pearl)"/>
    <path d="M175 427c17-13 39-7 52 12 11 17 15 36 10 52-19 12-40 3-53-15-11-16-16-36-9-49z" fill="#F6BDD3" stroke="none"/>
    <path d="M454 433c22-34 60-34 75 0 15 35-9 85-47 91-26 4-48-17-45-45 1-17 7-33 17-46z" fill="url(#pearl)"/>
    <path d="M523 437c-16-14-39-9-52 10-12 16-16 35-12 51 18 13 40 5 53-13 12-15 18-35 11-48z" fill="#F6BDD3" stroke="none"/>
    <path d="M183 477q25 16 50 4M465 489q25 15 49 1" fill="none" stroke="#E89AB9" stroke-width="7"/>
  </g>
</svg>
